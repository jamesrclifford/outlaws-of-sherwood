name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 "$RUNNER_TEMP/godot"
      - name: Run tests
        run: GODOT="$RUNNER_TEMP/godot" tests/run.sh
